<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>HealthTree — Assessment</title>
    <link rel="stylesheet" href="survey.css">
</head>
<body>
    <header>
        <img src="Tree.png">
    </header>
    <article class="container">
        <div class="chatbox">
            <h1 id="welcome"></h1>
            <div id="counter">Question 1 of 10</div>
            <div id="chatLog" class="chat-log"></div>
            <form>
                <div class="textbox">
                    <input type="text" name="input" class="input" placeholder="Type your message..." autocomplete="off" required>
                    <button type="submit" class="submit">+</button>
                </div>
            </form>
        </div>
    </article>
    <footer class="footer">
        <div class="footer-content">
            <h3>HealthTree</h3>
            <p>AI-powered health assessments designed to support better wellbeing.</p>
            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
                <a href="#">Contact</a>
                <a href="#">Support</a>
            </div>
            <p class="disclaimer">
                HealthTree does not provide medical diagnosis. Always consult a qualified healthcare professional.
            </p>
            <p class="copyright">
                &copy; 2026 HealthTree. All rights reserved.
            </p>
        </div>
    </footer>
    <script src="config.js"></script>
    <script src="survey.js"></script>
</body>
</html>
